<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Overworld">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="neo-mark" content="on">

  <!--
    The load-bearing directive here is connect-src. It is what makes the promise
    on the Connect view checkable rather than a claim: this page can talk to
    habitica.com and nowhere else, so the credentials have no route to any other
    host even if something on the page were compromised.

    style-src keeps 'unsafe-inline' because the charts set bar widths through
    style attributes. That is a real relaxation, and it is the reason script-src
    is kept strict at 'self' with no inline scripts at all.

    frame-ancestors and X-Frame-Options are deliberately absent: both are ignored
    in a meta CSP, and GitHub Pages cannot send response headers. Writing them
    here would look like protection while doing nothing.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://gc.zgo.at https://static.cloudflareinsights.com; connect-src 'self' https://habitica.com https://neorgon.goatcounter.com https://cloudflareinsights.com; style-src 'self' https://cdn.neorgon.org 'unsafe-inline'; img-src 'self' https://cdn.neorgon.org data: https://neorgon.goatcounter.com; font-src 'self' https://cdn.neorgon.org data:; base-uri 'self'; form-action 'none'; object-src 'none'">

  <title>Overworld | Your Habitica day, at a glance</title>
  <meta name="description" content="Map your Habitica tasks onto zones, see open missions where you are, and archive the completed to-dos Habitica deletes after 30 days">
  <meta property="og:title" content="Overworld: Habitica by zone">
  <meta property="og:description" content="See what you can do where you are, and keep the history Habitica throws away">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://overworld.neorgon.com/">
  <meta property="og:site_name" content="Neorgon">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Overworld: Habitica by zone">
  <meta name="twitter:description" content="See what you can do where you are, and keep the history Habitica throws away">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://overworld.neorgon.com/">
  <meta property="og:locale" content="en_US">
  <meta name="theme-color" content="#16110d">
  <meta name="neo-repo" content="https://github.com/energon-a-secas/overworld-site">
  <!-- og:image: uncomment when social preview image is ready (1200x630)
  <meta property="og:image" content="https://overworld.neorgon.com/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630"> -->
  <!-- Fleet design tokens: canonical, do not redeclare locally (PROJECTS.md section 5) -->
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/styles/base.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/neorgon-header.css">
  <link rel="stylesheet" href="css/neorgon-themes.css">
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/header/season.css">
  <script defer src="js/neorgon-header.js"></script>
  <link rel="stylesheet" href="css/neorgon-footer.css">

    "url": "https://overworld.neorgon.com/",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Organization", "name": "Neorgon", "url": "https://neorgon.com/" }
  }
  </script>
</head>
<body>

  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
